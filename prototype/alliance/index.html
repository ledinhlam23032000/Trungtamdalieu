<style>

:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --pos:#4ade80;--pend:#f0b058;--neg:#f87171;--posbg:#12301f;--pendbg:#33240f;--negbg:#3a1616;

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--a950)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--a950);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;max-width:1320px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:15px;letter-spacing:.02em}
.brand span{font-size:10px;letter-spacing:.2em;color:var(--g300);font-weight:700;text-transform:uppercase}
.ctl{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.ctl label{font-size:11px;color:#b9cfc7}
.ctl select{max-width:min(320px,calc(100vw - 32px))}
.ctl select,.ctl input{background:#0d3d32;border:1px solid #2b5c4f;color:#fff;border-radius:8px;padding:5px 8px;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1320px;margin:8px auto 0;scrollbar-width:none}

.tabs a{color:#cfe3dc;text-decoration:none;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.tabs a.on{background:var(--g300);color:var(--a950)}
.tabs a:hover:not(.on){background:#0f4d3f}

main{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.banner{background:var(--g100);border:1px solid var(--g300);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:18px}

.head h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.head p{margin:0;color:var(--mute);font-size:13px;flex-basis:100%}
.grid{display:grid;gap:14px}
.g5{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{flex-wrap:wrap;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--mute)}
.kpi .s{font-size:12px;color:var(--mute);margin-top:4px}
.kpi.key{border-color:var(--g500);background:linear-gradient(180deg,var(--g100),var(--card) 70%)}
.vnd small{font-size:.6em;font-weight:600;opacity:.65;margin-left:1px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;font-weight:700;padding:9px 10px;background:var(--soft);white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--a50)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--card);cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.warn{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 180px}
.fld label{font-size:12px;color:var(--mute);font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px;min-height:38px;width:100%}
.hint{font-size:12px;color:var(--mute)}
.err{font-size:12px;color:var(--neg);font-weight:600}
.ok{font-size:12px;color:var(--pos);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.sep{height:1px;background:var(--line);margin:4px 0}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 0}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 12px;padding:4px 0 4px 26px}
.bundle{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bundle.on{border-color:var(--accent);background:var(--a50)}
.bars .bar{display:grid;grid-template-columns:150px 1fr 96px;gap:8px;align-items:center;font-size:12px;padding:3px 0}
.bars .track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.seats{display:flex;gap:6px;flex-wrap:wrap}
.seat{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;border:2px solid var(--line);color:var(--mute)}
.seat.taken{background:var(--a700);border-color:var(--a700);color:#fff}
.seat.gold.taken{background:var(--g500);border-color:var(--g500);color:var(--a950)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.li:first-child{border-top:0}
.li .amt{margin-left:auto;font-weight:700;white-space:nowrap}
.prog{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--a600),var(--g500))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--a950);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:20;max-width:min(92vw,560px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.bad{background:#7f1d1d}
.wf .bar{grid-template-columns:200px 1fr 110px}
.wf .track{position:relative;height:16px}
.wf .track i{position:absolute;top:0;height:100%}
.neg-i{background:var(--neg)!important}.pos-i{background:var(--pos)!important}.tot-i{background:var(--g500)!important}

.wallet .wl{font-size:12px;opacity:.75;margin-top:12px}

.wallet .wv small{font-size:14px;font-weight:500;opacity:.6}
.wallet .wbar{height:6px;border-radius:9px;background:rgba(255,255,255,.15);margin-top:12px;overflow:hidden}
.wallet .wbar i{display:block;height:100%;background:linear-gradient(90deg,#e6cf8f,#c9a24a)}
.wallet .wf2{display:flex;justify-content:space-between;font-size:11px;margin-top:10px;opacity:.9}
.wallet .wf2 b{color:#e6cf8f;letter-spacing:.12em}
.psec{margin:14px 16px 0;background:var(--card);border-radius:16px;border:1px solid var(--line);padding:14px}
.psec h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.earn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.earn div{border-radius:12px;padding:8px 10px;background:var(--a50);min-width:0}
.earn .k{font-size:11px;color:var(--mute)}.earn .v{font-size:15px;font-weight:700}
.earn .pe{background:var(--pendbg)}.earn .pe .v{color:var(--pend)}
.earn .av .v{color:var(--pos)}
.ptabs{display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:8px 0 12px;margin-top:16px}
.ptabs button{background:none;border:0;font-size:11px;color:var(--mute);min-height:44px;min-width:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}

.ptabs svg{width:20px;height:20px}
.journey{position:relative;height:48px;margin-top:4px}
.journey .tr{position:absolute;left:0;right:0;top:14px;height:4px;background:var(--line);border-radius:4px}
.journey .fi{position:absolute;left:0;top:14px;height:4px;background:var(--a600);border-radius:4px}
.journey .m{position:absolute;top:6px;width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--line);transform:translateX(-50%)}
.journey .m.me{border-color:var(--a600);background:var(--a600);box-shadow:0 0 0 5px var(--a100)}
.journey .m.gd{border-color:var(--g500)}
.journey .t{position:absolute;top:30px;font-size:10px;color:var(--mute);transform:translateX(-50%);white-space:nowrap}
.rings{display:flex;gap:14px;align-items:center}
.qrbox{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.side-note{flex:1 1 280px;min-width:0}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;max-width:260px}
</style>

const pad=n=>String(n).padStart(2,"0");
function mulDivFloor(a,b,c){ return Number((BigInt(Math.round(a))*BigInt(Math.round(b)))/BigInt(Math.round(c))); }
function vnd(n){ return (n<0?"−":"")+Math.abs(Math.round(n)).toLocaleString("vi-VN"); }
function vndH(n){ return `<span class="vnd num">${vnd(n)}<small>đ</small></span>`; }
function short(n){ const a=Math.abs(n), s=n<0?"−":""; if(a>=1e9) return s+(a/1e9).toLocaleString("vi-VN",{maximumFractionDigits:2})+" tỷ"; if(a>=1e6) return s+(a/1e6).toLocaleString("vi-VN",{maximumFractionDigits:1})+" tr"; return s+vnd(a)+"đ"; }
function shortH(n){ return `<span class="num" title="${vnd(n)}đ">${short(n)}</span>`; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); }
function fmtD(dt){ return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth()+1)}-${pad(dt.getUTCDate())}`; }
function addDays(s,n){ const d=parseD(s); d.setUTCDate(d.getUTCDate()+n); return fmtD(d); }
function addMonths(s,n){ const d=parseD(s); const day=d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+n); const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate(); d.setUTCDate(Math.min(day,last)); return fmtD(d); }
function vnDate(s){ if(!s) return "—"; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; }
const monthOf=s=>s.slice(0,7);
function nextMonth(m){ return addMonths(m+"-01",1).slice(0,7); }
function prevMonth(m){ return addMonths(m+"-01",-1).slice(0,7); }
function vnMonth(m){ const [y,mm]=m.split("-"); return `T${Number(mm)}/${y}`; }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function maskPhone(last5){ return "***"+String(last5).slice(-3); }
function initials(name){ const p=name.trim().split(/\s+/); return p.length>1? p.slice(0,-1).map(w=>w[0]+".").join("")+" "+p[p.length-1] : name; }

const HOLIDAYS = new Set(["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20","2026-04-27","2026-04-30","2026-05-01","2026-09-01","2026-09-02","2027-01-01","2027-02-04","2027-02-05","2027-02-08","2027-02-09","2027-02-10","2027-04-16","2027-04-30","2027-05-03","2027-09-02","2027-09-03"]);
function isWorkingDay(s){ const w=parseD(s).getUTCDay(); return w!==0 && w!==6 && !HOLIDAYS.has(s); }
function addWorkingDays(s,n){ let d=s, k=0; while(k<n){ d=addDays(d,1); if(isWorkingDay(d)) k++; } return d; }
function workingDaysBetween(a,b){ let d=a,k=0; while(d<b){ d=addDays(d,1); if(isWorkingDay(d)) k++; } return k; }

const F = {
  refundUnused:(balance)=> mulDivFloor(PKG_PRICE, Math.max(0,balance), ENTITLEMENT),                         // F1
  addon:(paidNet, bps)=> mulDivFloor(Math.max(0,paidNet), bps, 10000),                                        // F3
  settle2B:({paid,usedValue,bonusOwed=0})=> paid - mulDivFloor(usedValue,500000000,1500000000) + bonusOwed,   // F7
  settle5:({paid,owed=0,received,totalValue=1800000000,direct=0})=> paid + owed - mulDivFloor(received,570000000,totalValue) - direct, // F8
  profitShare:({bps,profit,activeDays,periodDays})=> profit<=0 ? 0 : mulDivFloor(mulDivFloor(profit,bps,10000),activeDays,periodDays), // F6
  secondLevel:(log)=>{ if(!ALLOW_SECOND_LEVEL){ log && log("TỪ CHỐI tính thưởng cấp 2 (ALLOW_SECOND_LEVEL=false)"); return {ok:false,reason:"Chương trình chỉ tính 1 cấp (người giới thiệu trực tiếp)."}; } }
};
// Duy trì tháng (mục 6.4): trả về hành động đề xuất, KHÔNG BAO GIỜ tự chấm dứt.
function evaluateMaintenance(months, required){
  // months: [{contracts, activities, planGiven, excused}] theo thứ tự thời gian
  let streak=0, out=[];
  for(const m of months){
    const counted = m.planGiven!==false && !m.excused;
    const missAct = m.activities<1;
    if(!counted){ out.push({status:"KHONG_TINH",note:"Bệnh viện không giao kế hoạch / tạm nghỉ đã duyệt — tháng này không tính"}); continue; }
    if(missAct){ streak++; out.push(streak>=2? {status:"MO_VU_VIEC",note:"2 tháng liên tiếp thiếu nhiệm vụ → mở vụ việc, đếm 10 ngày làm việc giải trình"} : {status:"WARNED",note:"Thiếu nhiệm vụ tháng 1 → soạn thông báo nhắc, Ban điều hành duyệt gửi"}); }
    else { streak=0; out.push(m.contracts<required? {status:"NHAC",note:"Thiếu hợp đồng nhưng có nhiệm vụ → chỉ nhắc + kế hoạch khắc phục"} : {status:"DAT",note:"Đạt cả 2 vòng"}); }
  }
  return out;
}
function terminationDecisionAllowed(noticeDate, explanationDate){
  // explanationDate null = không nộp. Cho phép quyết định khi đã hết 10 ngày làm việc và không có giải trình hợp lệ trong hạn.
  const deadline = addWorkingDays(noticeDate,10);
  if(explanationDate && explanationDate<=deadline) return {allowed:false,deadline,reason:"Có giải trình trong hạn — xem xét giải trình"};
  return {allowed:true,deadline,reason: explanationDate? "Giải trình nộp sau hạn":"Không giải trình"};
}

function uid(p){ return p+Math.random().toString(36).slice(2,9); }
class Store {
  constructor(state){ this.s = state; }
  get today(){ return this.s.today; }
  actor(){ return STAFF.find(x=>x.id===this.s.actorId)||STAFF[0]; }
  can(action){ return CAN[action].includes(this.actor().role); }
  need(action){ if(!this.can(action)) throw new Error(`${this.actor().name} (${this.actor().label}) không có quyền thao tác này.`); }
  log(action, detail){ this.s.audit.unshift({at:this.today+" "+new Date().toTimeString().slice(0,5),actor:this.actor().name,action,detail}); if(this.s.audit.length>400) this.s.audit.length=400; }
  nextCode(kind){ this.s.seq[kind]=(this.s.seq[kind]||0)+1; return this.s.seq[kind]; }
  newPartnerCode(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c; do{ c="HP-"+Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join(""); }while(this.s.partners.some(p=>p.code===c)); return c; }
  person(id){ return this.s.people.find(p=>p.id===id); }
  partner(id){ return this.s.partners.find(p=>p.id===id); }
  partnerName(id){ const p=this.partner(id); return p? this.person(p.customerId).name : "—"; }
  partnerByCode(code){ return this.s.partners.find(p=>p.code.toUpperCase()===String(code).trim().toUpperCase()); }
  contract(id){ return this.s.contracts.find(c=>c.id===id); }
  paid(cid){ return this.s.pkgPayments.filter(p=>p.contractId===cid).reduce((a,p)=>a+p.amount,0); }
  balance(cid){ return this.s.wallet.filter(w=>w.contractId===cid).reduce((a,w)=>a+w.amount,0); }
  used(cid){ return -this.s.wallet.filter(w=>w.contractId===cid&&w.kind==="REDEEM").reduce((a,w)=>a+w.amount,0); }
  isValidForKpi(c){ return !!c.fullyPaidAt && c.status!=="CANCELLED" && c.countsForKpi; }

  // Bán gói: tạo khách (nếu mới) + Đối tác cho người mua + hợp đồng.
  sell({buyerName,last5,referralCode,pin,firstPayment,date}){
    this.need("sell");
    buyerName=String(buyerName||"").trim(); last5=String(last5||"").trim();
    if(buyerName.length<2) throw new Error("Nhập họ tên người mua.");
    if(!/^\d{5}$/.test(last5)) throw new Error("Nhập đúng 5 số cuối SĐT.");
    if(!/^\d{6}$/.test(String(pin||""))) throw new Error("Khách tự đặt PIN 6 số để xác nhận mỗi lần dùng quyền lợi.");
    let person = this.s.people.find(p=>p.last5===last5 && p.name.toLowerCase()===buyerName.toLowerCase());
    if(!person){ person={id:uid("kh"),name:buyerName,last5}; this.s.people.push(person); }
    let owner = this.s.partners.find(p=>p.customerId===person.id);
    let attributed = null;
    if(referralCode){
      attributed = this.partnerByCode(referralCode);
      if(!attributed) throw new Error(`Không tìm thấy mã đối tác ${referralCode}.`);
      if(owner && attributed.id===owner.id) throw new Error("Người mua không được tự giới thiệu chính mình (Q7).");
    }
    const repeat = !!owner && this.s.contracts.some(c=>c.ownerPartnerId===owner.id && c.status!=="CANCELLED");
    if(!owner){ owner={id:uid("dt"),code:this.newPartnerCode(),customerId:person.id,joinedAt:date||this.today,tier:"MEMBER"}; this.s.partners.push(owner); }
    if(attributed && attributed.id===owner.id) throw new Error("Người mua không được tự giới thiệu chính mình (Q7).");
    const c={id:uid("hd"),code:"GOI-"+String(this.nextCode("contract")).padStart(6,"0"),ownerPartnerId:owner.id,attributedPartnerId:attributed?attributed.id:null,
      soldBy:this.actor().name,soldById:this.actor().id,signedAt:date||this.today,fullyPaidAt:null,expiresAt:null,status:"SIGNED",pin:String(pin),countsForKpi:!repeat,endedAt:null,refundDueAt:null,mechVersion:this.s.mech.version};
    this.s.contracts.push(c);
    this.log("BÁN GÓI",`${c.code} · ${buyerName} (${maskPhone(last5)})${attributed?` · giới thiệu: ${this.partnerName(attributed.id)} ${attributed.code}`:""}${repeat?" · gói thứ 2 — không tính KPI (Q2)":""}`);
    if(firstPayment>0) this.collect(c.id, firstPayment, date);
    return c;
  }
  collect(cid, amount, date){
    this.need("collect");
    const c=this.contract(cid); amount=Math.round(Number(amount)||0);
    if(!c||!["SIGNED","ACTIVE"].includes(c.status)) throw new Error("Hợp đồng không ở trạng thái thu tiền.");
    const due = PKG_PRICE - this.paid(cid);
    if(amount<=0) throw new Error("Số tiền phải lớn hơn 0.");
    if(amount>due) throw new Error(`Chỉ còn phải thu ${vnd(due)}đ.`);
    const d=date||this.today;
    this.s.pkgPayments.push({id:uid("tt"),contractId:cid,kind:"PAYMENT",amount,at:d,by:this.actor().name});
    this.log("THU TIỀN GÓI",`${c.code} · ${vnd(amount)}đ`);
    if(this.paid(cid)===PKG_PRICE && !c.fullyPaidAt) this.activate(c,d);
  }
  activate(c,d){
    c.fullyPaidAt=d; c.status="ACTIVE"; c.expiresAt=addMonths(d,12);
    this.s.wallet.push({id:uid("vi"),contractId:c.id,kind:"GRANT",amount:ENTITLEMENT,label:"Kích hoạt ví quyền lợi",at:d,by:this.actor().name,key:"GRANT:"+c.id});
    if(c.attributedPartnerId){
      // T11: mỗi hợp đồng chỉ một khoản 3tr dương
      if(this.s.commissions.some(e=>e.contractId===c.id && e.type==="REFERRAL_FLAT" && e.amount>0)) throw new Error("Hợp đồng đã có hoa hồng giới thiệu.");
      this.s.commissions.push({id:uid("hh"),partnerId:c.attributedPartnerId,type:"REFERRAL_FLAT",state:"PENDING",amount:REFERRAL_FLAT,basis:PKG_PRICE,sourceType:"PACKAGE_CONTRACT",sourceRef:c.id,contractId:c.id,period:monthOf(d),batchId:null,at:d,note:`Giới thiệu ${c.code}`,mech:"REFERRAL_FLAT v"+this.s.mech.version});
    }
    this.log("KÍCH HOẠT VÍ",`${c.code} · +30.000.000đ · hạn ${vnDate(c.expiresAt)}`);
  }
  saveSelection(cid,{bundle,options,extras}){
    this.need("select");
    const c=this.contract(cid); if(!c||c.status!=="ACTIVE") throw new Error("Chỉ lập phiếu chọn khi ví đã kích hoạt.");
    const b = bundle? BUNDLES.find(x=>x.code===bundle):null;
    const alreadyBundle = this.s.selections.some(s=>s.contractId===cid && s.lines.some(l=>l.code.startsWith("A")));
    if(b && alreadyBundle) throw new Error("Hợp đồng đã chọn gói chính. Phần còn lại trong ví dùng để chọn tiếp dịch vụ phần B.");
    if(b && b.opts.length){
      if(!options.length) throw new Error(`Gói ${b.code}: chọn ít nhất 1 vùng/lựa chọn.`);
      if(b.pickMax && options.length>b.pickMax) throw new Error(`Gói ${b.code}: chỉ được chọn tối đa ${b.pickMax}.`);
    }
    if(!b && !extras.length) throw new Error("Chưa chọn gì.");
    const lines=[];
    if(b) lines.push({code:b.code,name:b.name+(options.length?` (${options.join(", ")})`:""),unitValue:b.value,qty:1,state:"CHO_BAC_SI"});
    for(const e of extras){ const it=itemByCode(e.code); lines.push({code:it.code,name:it.name,unitValue:it.price,qty:Math.max(1,e.qty|0),state:"CHO_BAC_SI"}); }
    const sel={id:uid("pc"),contractId:cid,at:this.today,by:this.actor().name,lines,doctor:null};
    this.s.selections.push(sel);
    this.log("PHIẾU CHỌN",`${c.code} · ${lines.length} mục (mong muốn, chưa phải chỉ định)`);
  }
  prescribe(selId, decisions){
    this.need("prescribe");
    const sel=this.s.selections.find(s=>s.id===selId);
    sel.lines.forEach((l,i)=>{ if(l.state!=="CHO_BAC_SI") return; const d=decisions[i]; if(!d) return; if(d.ok){ l.state="DA_CHI_DINH"; l.qty=Math.max(1,d.qty|0); } else l.state="KHONG_CHI_DINH"; });
    sel.doctor=this.actor().name;
    this.log("BÁC SĨ CHỈ ĐỊNH",`${this.contract(sel.contractId).code} · ${sel.lines.filter(l=>l.state==="DA_CHI_DINH").length} mục được chỉ định`);
  }
  // Ghi nhận sử dụng: trừ ví (bắt buộc PIN). Vượt ví: bắt buộc đồng ý trước, phần vượt thu riêng như dịch vụ ngoài gói.
  redeem(selId, lineIdx, {pin, overageConsent, overagePaid}){
    this.need("redeem");
    const sel=this.s.selections.find(s=>s.id===selId); const c=this.contract(sel.contractId); const l=sel.lines[lineIdx];
    if(c.status!=="ACTIVE") throw new Error("Ví không còn hiệu lực.");
    if(l.state!=="DA_CHI_DINH") throw new Error("Mục này chưa được bác sĩ chỉ định.");
    if(String(pin)!==c.pin) throw new Error("PIN của chủ gói không đúng. Không ghi nhận.");
    const value=l.unitValue*l.qty, bal=this.balance(c.id);
    if(bal<=0) throw new Error("Ví đã hết.");
    const fromWallet=Math.min(value,bal), over=value-fromWallet;
    if(over>0 && !overageConsent) throw new Error(`Vượt ví ${vnd(over)}đ — cần khách đồng ý trước khi làm (T16).`);
    if(over>0 && Math.round(overagePaid||0)>over) throw new Error("Số thu phần vượt lớn hơn phần vượt.");
    this.s.wallet.push({id:uid("vi"),contractId:c.id,kind:"REDEEM",amount:-fromWallet,label:l.name,itemCode:l.code,at:this.today,by:this.actor().name,key:`REDEEM:${selId}:${lineIdx}`,caseService:"HS-"+String(this.nextCode("case")).padStart(6,"0")+" (dòng giá 0đ)"});
    l.state="DA_DUNG";
    this.log("GHI NHẬN SỬ DỤNG",`${c.code} · ${l.name} · trừ ${vnd(fromWallet)}đ · còn ${vnd(this.balance(c.id))}đ · khách xác nhận PIN`);
    if(over>0) this.addon(c.id,{itemCode:l.code,name:l.name+" (phần vượt ví)",gross:over,discount:0,paid:Math.round(overagePaid||0)});
    if(this.balance(c.id)===0){ c.status="CONSUMED"; c.endedAt=this.today; this.log("DÙNG HẾT VÍ",c.code); }
  }
  addon(cid,{itemCode,name,gross,discount,paid}){
    this.need("addon");
    const c=this.contract(cid); gross=Math.round(gross); discount=Math.round(discount||0); paid=Math.round(paid||0);
    if(gross<=0) throw new Error("Giá dịch vụ phải lớn hơn 0.");
    if(discount<0||discount>gross) throw new Error("Giảm giá không hợp lệ.");
    if(paid<0||paid>gross-discount) throw new Error("Số thu vượt giá sau giảm.");
    const it=itemByCode(itemCode); const group=it&&it.group?it.group:"B01";
    const a={id:uid("nt"),contractId:cid,itemCode,name,gross,discount,paid,at:this.today,by:this.actor().name};
    this.s.addons.push(a);
    this.log("DỊCH VỤ NGOÀI GÓI",`${c.code} · ${name} · thực thu ${vnd(paid)}đ`);
    if(c.attributedPartnerId && paid>0){
      const bps=ADDON_BPS[group]??1200; const amt=F.addon(paid,bps);
      this.s.commissions.push({id:uid("hh"),partnerId:c.attributedPartnerId,type:"ADDON_PCT",state:"PENDING",amount:amt,basis:paid,rateBps:bps,sourceType:"ADDON_PAYMENT",sourceRef:a.id,contractId:cid,period:monthOf(this.today),batchId:null,at:this.today,note:`Ngoài gói: ${name}`,mech:"ADDON_PCT v"+this.s.mech.version});
    }
  }
  // Hết hạn / chấm dứt: hoàn phần chưa dùng theo F1, hạn 15 ngày làm việc. Không thu hồi hoa hồng giới thiệu.
  endWithRefund(cid, reason){
    this.need("end");
    const c=this.contract(cid); if(c.status!=="ACTIVE") throw new Error("Chỉ áp dụng cho hợp đồng đang hiệu lực.");
    const bal=this.balance(cid), refund=F.refundUnused(bal);
    if(bal>0) this.s.wallet.push({id:uid("vi"),contractId:cid,kind:reason==="EXPIRED"?"EXPIRE":"REFUND_CONVERSION",amount:-bal,label:reason==="EXPIRED"?"Hết hạn — quy đổi hoàn tiền":"Chấm dứt — quy đổi hoàn tiền",at:this.today,by:this.actor().name,key:"END:"+cid});
    if(refund>0) this.s.pkgPayments.push({id:uid("tt"),contractId:cid,kind:"REFUND",amount:-refund,at:this.today,by:this.actor().name});
    c.status=reason==="EXPIRED"?"EXPIRED":"TERMINATED"; c.endedAt=this.today; c.refundDueAt=addWorkingDays(this.today,15);
    this.log(reason==="EXPIRED"?"HẾT HẠN":"CHẤM DỨT",`${c.code} · số dư ${vnd(bal)}đ → hoàn ${vnd(refund)}đ (F1) · hạn ${vnDate(c.refundDueAt)}`);
    return refund;
  }
  // Huỷ hợp đồng, hoàn toàn bộ tiền đã thu (ví chưa dùng). Hoa hồng: chưa trả → huỷ; đã trả → bút toán −3tr bù trừ kỳ sau (D6).
  cancel(cid){
    this.need("end");
    const c=this.contract(cid);
    if(!["SIGNED","ACTIVE"].includes(c.status)) throw new Error("Không huỷ được hợp đồng ở trạng thái này.");
    if(this.used(cid)>0) throw new Error("Ví đã dùng một phần — dùng 'Chấm dứt & hoàn phần chưa dùng'.");
    const paid=this.paid(cid);
    if(this.balance(cid)>0) this.s.wallet.push({id:uid("vi"),contractId:cid,kind:"REFUND_CONVERSION",amount:-this.balance(cid),label:"Huỷ hợp đồng",at:this.today,by:this.actor().name,key:"CANCEL:"+cid});
    if(paid>0) this.s.pkgPayments.push({id:uid("tt"),contractId:cid,kind:"REFUND",amount:-paid,at:this.today,by:this.actor().name});
    c.status="CANCELLED"; c.endedAt=this.today;
    for(const e of this.s.commissions.filter(e=>e.contractId===cid && e.amount>0 && e.type==="REFERRAL_FLAT")){
      if(this.s.commissions.some(x=>x.reversalOf===e.id)) continue;
      if(["PENDING","ELIGIBLE"].includes(e.state) && !e.batchId){ e.state="VOID"; this.s.commissions.push({id:uid("hh"),partnerId:e.partnerId,type:"CLAWBACK",state:"VOID",amount:-e.amount,sourceType:"REVERSAL",sourceRef:e.id,reversalOf:e.id,contractId:cid,period:e.period,at:this.today,note:`Huỷ ${c.code} trước khi trả — đảo hoa hồng`}); }
      else this.s.commissions.push({id:uid("hh"),partnerId:e.partnerId,type:"OFFSET",state:"ELIGIBLE",amount:-e.amount,sourceType:"REVERSAL",sourceRef:e.id,reversalOf:e.id,contractId:cid,period:nextMonth(monthOf(this.today)),at:this.today,note:`Huỷ ${c.code} sau khi đã trả — bù trừ kỳ sau (D6)`});
    }
    this.log("HUỶ HỢP ĐỒNG",`${c.code} · hoàn ${vnd(paid)}đ`);
  }
  // Đối soát tháng: hoa hồng PENDING của kỳ ≤ period, hợp đồng còn hợp lệ tại ngày đối soát → ELIGIBLE.
  reconcile(period){
    this.need("reconcile");
    if(period>=monthOf(this.today)) throw new Error("Chỉ đối soát kỳ đã kết thúc.");
    let n=0,sum=0;
    for(const e of this.s.commissions){
      if(e.state!=="PENDING"||e.period>period) continue;
      const c=e.contractId? this.contract(e.contractId):null;
      if(c && c.status==="CANCELLED") continue;
      e.state="ELIGIBLE"; e.eligibleAt=this.today; n++; sum+=e.amount;
    }
    this.log("ĐỐI SOÁT",`Kỳ ${vnMonth(period)} · ${n} khoản chuyển "Đủ điều kiện" · ${vnd(sum)}đ`);
    return {n,sum};
  }
  createBatch(){
    this.need("batchCreate");
    const pool=this.s.commissions.filter(e=>e.state==="ELIGIBLE"&&!e.batchId);
    const byP={}; for(const e of pool){ (byP[e.partnerId]=byP[e.partnerId]||[]).push(e); }
    const ids=[]; let total=0; const lines=[];
    for(const [pid,es] of Object.entries(byP)){ const net=es.reduce((a,e)=>a+e.amount,0); if(net<=0) continue; es.forEach(e=>ids.push(e.id)); total+=net; lines.push({partnerId:pid,net,count:es.length}); }
    if(!ids.length) throw new Error("Không có khoản nào đủ điều kiện (hoặc số âm còn lớn hơn số dương — chuyển kỳ sau).");
    const b={id:uid("lo"),code:"LO-"+String(this.nextCode("batch")).padStart(4,"0"),createdBy:this.actor().name,createdAt:this.today,approvedBy:null,status:"CHO_DUYET",entryIds:ids,total,lines};
    ids.forEach(id=>{ const e=this.s.commissions.find(x=>x.id===id); e.state="IN_BATCH"; e.batchId=b.id; });
    this.s.batches.unshift(b);
    this.log("LẬP LÔ CHI TRẢ",`${b.code} · ${lines.length} đối tác · ${vnd(total)}đ — chờ duyệt`);
    return b;
  }
  approveBatch(bid){
    this.need("batchApprove");
    const b=this.s.batches.find(x=>x.id===bid);
    if(b.status!=="CHO_DUYET") throw new Error("Lô không ở trạng thái chờ duyệt.");
    if(b.createdBy===this.actor().name) throw new Error("Người lập lô không được tự duyệt (tách quyền hai người).");
    b.status="DA_DUYET"; b.approvedBy=this.actor().name; b.approvedAt=this.today;
    b.requests=b.lines.map(l=>({code:"DNTT-"+String(this.nextCode("pr")).padStart(5,"0"),partnerId:l.partnerId,amount:l.net}));
    this.log("DUYỆT LÔ",`${b.code} · sinh ${b.requests.length} giấy đề nghị thanh toán`);
  }
  payBatch(bid){
    this.need("batchPay");
    const b=this.s.batches.find(x=>x.id===bid);
    if(b.status!=="DA_DUYET") throw new Error("Lô phải được duyệt trước khi ghi đã chuyển.");
    b.status="DA_TRA"; b.paidAt=this.today;
    b.entryIds.forEach(id=>{ const e=this.s.commissions.find(x=>x.id===id); e.state="PAID"; e.paidAt=this.today; });
    this.log("ĐÃ CHUYỂN",`${b.code} · ${vnd(b.total)}đ — kế toán ghi chứng từ chuyển khoản`);
  }
  rejectBatch(bid){
    this.need("batchApprove");
    const b=this.s.batches.find(x=>x.id===bid);
    if(b.status!=="CHO_DUYET") throw new Error("Chỉ trả lại lô đang chờ duyệt.");
    b.status="TRA_LAI"; b.approvedBy=this.actor().name;
    b.entryIds.forEach(id=>{ const e=this.s.commissions.find(x=>x.id===id); e.state="ELIGIBLE"; e.batchId=null; });
    this.log("TRẢ LẠI LÔ",b.code);
  }
  addActivity(partnerId,title){
    this.need("activity");
    this.s.activities.push({id:uid("nv"),partnerId,month:monthOf(this.today),title,at:this.today,by:this.actor().name});
    this.log("GHI NHẬN NHIỆM VỤ",`${this.partnerName(partnerId)} · ${title}`);
  }
  requestSecondLevel(){ const r=F.secondLevel(m=>this.log("CHẶN CẤP 2",m)); return r; }
  // Số liệu
  kpiCount(pid, month){ return this.s.contracts.filter(c=>c.attributedPartnerId===pid && this.isValidForKpi(c) && (!month||monthOf(c.fullyPaidAt)===month)).length; }
  earnings(pid){
    const es=this.s.commissions.filter(e=>e.partnerId===pid && e.state!=="VOID");
    const sum=st=>es.filter(e=>st.includes(e.state)).reduce((a,e)=>a+e.amount,0);
    return {pending:sum(["PENDING"]),available:sum(["ELIGIBLE","IN_BATCH"]),paid:sum(["PAID"]),entries:es};
  }
}

const ROUTES=[["dai-chi-huy","Đài chỉ huy"],["hieu-suat","Hiệu suất & tăng trưởng"],["quay","Quầy: bán gói & sử dụng"],["ke-toan","Hoa hồng & chi trả"],["cong-doi-tac","Cổng đối tác"],["suat","Suất 2% / 5%"],["mo-phong","Mô phỏng kinh tế"],["kiem-thu","Kiểm thử số vàng"],["danh-muc","Danh mục"],["phan-quyen","Phân quyền"],["nhat-ky","Nhật ký"]];

const $=sel=>document.querySelector(sel);
function toast(msg,bad){ const t=$("#toast"); t.textContent=msg; t.className="toast"+(bad?" bad":""); t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3800); }
function act(fn,okMsg){ try{ const r=fn(); save(); render(); if(okMsg) toast(typeof okMsg==="function"?okMsg(r):okMsg); return r; }catch(e){ toast(e.message,true); } }
function roleNow(){ return S.actor().role; }
function allowed(r){ return (ROUTE_ROLES[r]||[]).includes(roleNow()); }
function defaultRoute(){ const r=roleNow(); return r==="PARTNER"?"cong-doi-tac":["ADMIN","MANAGER","SHAREHOLDER"].includes(r)?"dai-chi-huy":"hieu-suat"; }
function route(){ const h=location.hash.slice(1); return ROUTES.some(r=>r[0]===h)&&allowed(h)?h:defaultRoute(); }
function actorPartnerId(){ const a=S.actor(); if(a.role!=="PARTNER") return null; const p=S.s.partners.find(x=>S.person(x.customerId).name===a.partnerName); return p?p.id:null; }

function renderTop(){
  const groups=[...new Set(STAFF.map(x=>x.role))];
  $("#actor").innerHTML=groups.map(g=>`<optgroup label="${ROLE_LABEL[g]}">${STAFF.filter(x=>x.role===g).map(x=>`<option value="${x.id}" ${x.id===S.s.actorId?"selected":""}>${esc(x.name)} — ${esc(x.label)}</option>`).join("")}</optgroup>`).join("");

  $("#tabs").innerHTML=ROUTES.filter(([k])=>allowed(k)).map(([k,l])=>`<a href="#${k}" class="${k===r?"on":""}">${l}</a>`).join("");
}
function statusPill(c){
  const m={DRAFT:["mute","Nháp"],SIGNED:["pend","Đã ký · chưa thu đủ"],ACTIVE:["pos","Đang hiệu lực"],CONSUMED:["mute","Đã dùng hết"],EXPIRED:["neg","Hết hạn"],TERMINATED:["neg","Chấm dứt"],CANCELLED:["neg","Đã huỷ"]}[c.status];
  return `<span class="pill ${m[0]}">${m[1]}</span>`;
}
function cPill(e){ const m={PENDING:["pend","Chờ đối soát"],ELIGIBLE:["pos","Khả dụng"],IN_BATCH:["pend","Trong lô chi trả"],PAID:["pos","Đã trả"],VOID:["mute","Đã huỷ"]}[e.state]; return `<span class="pill ${m[0]}">${m[1]}</span>`; }
const TYPE_LABEL={REFERRAL_FLAT:"Giới thiệu gói",ADDON_PCT:"Ngoài gói",MILESTONE_BONUS:"Thưởng mốc",OFFSET:"Bù trừ",CLAWBACK:"Đảo hoa hồng"};

// ---------- Đài chỉ huy ----------
function viewDashboard(){
  const s=S.s, m=monthOf(S.today), pm=prevMonth(m);
  const soldM=s.contracts.filter(c=>c.fullyPaidAt&&monthOf(c.fullyPaidAt)===m).length;
  const soldP=s.contracts.filter(c=>c.fullyPaidAt&&monthOf(c.fullyPaidAt)===pm).length;
  const dayFrac=Number(S.today.slice(8))/new Date(Date.UTC(+m.slice(0,4),+m.slice(5),0)).getUTCDate();
  const cashM=s.pkgPayments.filter(p=>monthOf(p.at)===m).reduce((a,p)=>a+p.amount,0);
  const addonM=s.addons.filter(a=>monthOf(a.at)===m).reduce((a,x)=>a+x.paid,0);
  const active=s.contracts.filter(c=>c.status==="ACTIVE");
  const obligation=active.reduce((a,c)=>a+S.balance(c.id),0);
  const obligationCost=active.reduce((a,c)=>a+mulDivFloor(COST_PER_PACKAGE,S.balance(c.id),ENTITLEMENT),0);
  const provision=active.reduce((a,c)=>a+F.refundUnused(S.balance(c.id)),0);
  const pend=s.commissions.filter(e=>e.state==="PENDING").reduce((a,e)=>a+e.amount,0);
  const elig=s.commissions.filter(e=>["ELIGIBLE","IN_BATCH"].includes(e.state)).reduce((a,e)=>a+e.amount,0);
  const all=s.contracts.filter(c=>c.status!=="CANCELLED");
  const funnel=[["Đã ký",all.length],["Thu đủ",all.filter(c=>c.fullyPaidAt).length],["Đã dùng lần 1",all.filter(c=>S.used(c.id)>0).length],["Dùng hết ví",all.filter(c=>c.status==="CONSUMED").length],["Mua thêm ngoài gói",new Set(s.addons.map(a=>a.contractId)).size]];
  const fmax=funnel[0][1]||1;
  const near=s.partners.map(p=>({p,n:S.kpiCount(p.id)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,6);
  const exp30=active.filter(c=>c.expiresAt && daysBetween(S.today,c.expiresAt)<=30 && daysBetween(S.today,c.expiresAt)>=0);
  const exp90=active.filter(c=>c.expiresAt && daysBetween(S.today,c.expiresAt)<=90 && daysBetween(S.today,c.expiresAt)>30);
  const batchWait=s.batches.filter(b=>b.status==="CHO_DUYET");
  const selWait=s.selections.filter(x=>x.lines.some(l=>l.state==="CHO_BAC_SI"));
  const eligUnbatched=s.commissions.filter(e=>e.state==="ELIGIBLE"&&!e.batchId).length;
  const refundsDue=s.contracts.filter(c=>c.refundDueAt && c.refundDueAt>=S.today);
  const seatIssues=[...s.seats.s2.map(x=>({...x,req:1})),...s.seats.s5.map(x=>({...x,req:3}))].filter(x=>!s.activities.some(a=>a.partnerId===x.partnerId&&a.month===m));
  const todo=[
    ...seatIssues.map(x=>["neg",`${esc(S.partnerName(x.partnerId))}: chưa có nhiệm vụ chung tháng này`,"#suat"]),
    ...batchWait.map(b=>["pend",`Lô ${b.code} (${short(b.total)}) chờ Ban điều hành duyệt`,"#ke-toan"]),
    ...(eligUnbatched?[["pend",`${eligUnbatched} khoản hoa hồng khả dụng chưa vào lô`,"#ke-toan"]]:[]),
    ...selWait.map(x=>["pend",`Phiếu chọn ${esc(S.contract(x.contractId).code)} chờ bác sĩ chỉ định`,"#quay"]),
    ...refundsDue.map(c=>["neg",`Hoàn ${esc(c.code)} trước ${vnDate(c.refundDueAt)} (15 ngày làm việc)`,"#quay"]),
    ...(exp30.length?[["neg",`${exp30.length} gói hết hạn trong 30 ngày — nhắc khách dùng nốt`,"#quay"]]:[]),
    ...(exp90.length?[["mute",`${exp90.length} gói hết hạn trong 31–90 ngày`,"#quay"]]:[])
  ];
  return `
  <div class="head"><h2>Đài chỉ huy — ${vnMonth(m)}</h2><p>Mỗi gói bán ra là một khoản bệnh viện nợ khách 30 triệu giá trị dịch vụ. Thẻ viền vàng là chỉ số quan trọng nhất.</p></div>
  <div class="grid g5">
    <div class="card kpi"><h3>Gói thu đủ trong tháng</h3><div class="v num">${soldM}</div><div class="s">Tháng trước ${soldP} · đã qua ${Math.round(dayFrac*100)}% tháng</div></div>
    <div class="card kpi"><h3>Thực thu chương trình</h3><div class="v">${shortH(cashM+addonM)}</div><div class="s">Gói ${short(cashM)} · ngoài gói ${short(addonM)}</div></div>
    <div class="card kpi key"><h3>Nghĩa vụ dịch vụ còn nợ</h3><div class="v">${shortH(obligation)}</div><div class="s">${active.length} ví đang mở · theo giá vốn ≈ ${short(obligationCost)}</div></div>
    <div class="card kpi"><h3>Hoa hồng phải trả</h3><div class="v">${shortH(pend+elig)}</div><div class="s"><span class="pill pend">Chờ ${short(pend)}</span> <span class="pill pos">Khả dụng ${short(elig)}</span></div></div>
    <div class="card kpi"><h3>Dự phòng hoàn khi hết hạn</h3><div class="v">${shortH(provision)}</div><div class="s">= 15tr × số dư / 30tr, nếu không ai dùng tiếp (D9)</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Phễu chương trình</h3><div class="bars">${funnel.map(([l,n])=>`<div class="bar"><span>${l}</span><div class="track"><i style="width:${Math.max(2,n/fmax*100)}%"></i></div><b class="num" style="text-align:right">${n}</b></div>`).join("")}</div></div>
    <div class="card"><h3>Cần xử lý hôm nay <span class="pill mute">${todo.length}</span></h3>
      <div class="list">${todo.length?todo.map(([k,t,h])=>`<a class="li" href="${h}" style="color:inherit;text-decoration:none"><span class="pill ${k}">${k==="neg"?"Cần làm":k==="pend"?"Chờ":"Theo dõi"}</span><span>${t}</span></a>`).join(""):`<div class="hint">Không có việc tồn.</div>`}</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Sơ đồ suất quyền lợi <a class="btn sm" href="#suat">Mở</a></h3>${seatMap()}</div>
    <div class="card"><h3>Gần mốc lên hạng (hợp đồng hợp lệ, ghi nhận trực tiếp)</h3>
      <div class="list">${near.map(({p,n})=>`<div class="li" style="flex-direction:column;gap:2px"><div style="display:flex;width:100%"><b>${esc(S.partnerName(p.id))}</b><span class="mono" style="margin-left:8px;color:var(--mute)">${p.code}</span><span class="amt num">${n} / ${n>=50?60:50}</span></div><div class="prog" style="width:100%"><i style="width:${Math.min(100,n/(n>=50?60:50)*100)}%"></i></div></div>`).join("")}</div>
      <p class="hint">Chỉ đếm hợp đồng gói đã thanh toán đủ, chưa huỷ, không đếm gói tự mua lần 2 (Q2). Không có bảng xếp hạng công khai.</p></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Danh sách đối tác <span class="pill mute">${s.partners.length}</span></h3>${partnerTable()}</div>`;
}
function seatMap(){
  const s=S.s; const row=(arr,max,gold)=>Array.from({length:max},(_,i)=>{ const t=arr.find(x=>x.no===i+1); return `<span class="seat ${gold?"gold":""} ${t?"taken":""}" title="${t?esc(S.partnerName(t.partnerId)):"Trống"}">${i+1}</span>`; }).join("");
  return `<div class="stack"><div><div class="hint" style="margin-bottom:6px">Suất 2% · ${s.seats.s2.length}/10</div><div class="seats">${row(s.seats.s2,10,false)}</div></div>
  <div><div class="hint" style="margin-bottom:6px">Suất 5% · ${s.seats.s5.length}/5</div><div class="seats">${row(s.seats.s5,5,true)}</div></div>
  <p class="hint">Suất trong bản chạy thử là minh hoạ quy trình (giai đoạn P3). Khuyến nghị: không ký suất thật trước khi P3 xong.</p></div>`;
}
function partnerTable(){
  const s=S.s; const m=monthOf(S.today);
  const rows=s.partners.map(p=>{ const e=S.earnings(p.id); const own=s.contracts.filter(c=>c.ownerPartnerId===p.id&&c.status==="ACTIVE"); const bal=own.reduce((a,c)=>a+S.balance(c.id),0); return {p,e,bal,kpi:S.kpiCount(p.id),kpiM:S.kpiCount(p.id,m)}; }).sort((a,b)=>b.kpi-a.kpi||b.e.paid-a.e.paid).slice(0,40);
  return `<div class="tbl"><table><thead><tr><th>Đối tác</th><th>Mã</th><th>Hạng</th><th class="r">Ví còn</th><th class="r">HĐ ghi nhận</th><th class="r">Tháng này</th><th class="r">Chờ</th><th class="r">Khả dụng</th><th class="r">Đã trả</th></tr></thead><tbody>
  ${rows.map(({p,e,bal,kpi,kpiM})=>{ const seat=s.seats.s5.some(x=>x.partnerId===p.id)?`<span class="pill pend" style="background:var(--g100);color:var(--ink)">Cao cấp 5%</span>`:s.seats.s2.some(x=>x.partnerId===p.id)?`<span class="pill pos">Quyền lợi 2%</span>`:`<span class="pill mute">Đối tác</span>`;
    return `<tr class="click" data-portal="${p.id}"><td>${esc(S.partnerName(p.id))}</td><td class="mono">${p.code}</td><td>${seat}</td><td class="r">${vndH(bal)}</td><td class="r num">${kpi}</td><td class="r num">${kpiM}</td><td class="r">${vndH(e.pending)}</td><td class="r">${vndH(e.available)}</td><td class="r">${vndH(e.paid)}</td></tr>`; }).join("")}
  </tbody></table></div><p class="hint">Bấm một dòng để xem cổng của đối tác đó. Hiển thị 40 dòng đầu.</p>`;
}

function viewCounter(){
  const s=S.s;
  const q=ui.q.trim().toLowerCase();
  const sc=scopeFor();
  const list=s.contracts.slice().reverse().filter(c=>sc.all||roleNow()==="RECEPTION"||roleNow()==="DOCTOR"||sc.ids.includes(c.soldById)).filter(c=>{ if(!q) return true; const o=S.person(S.partner(c.ownerPartnerId).customerId); return c.code.toLowerCase().includes(q)||o.name.toLowerCase().includes(q)||o.last5.endsWith(q)||S.partner(c.ownerPartnerId).code.toLowerCase().includes(q); }).slice(0,30);

  <div class="split">
    <div class="stack">
      ${S.can("sell")?`<div class="card"><h3>Bán gói 15 triệu</h3>${sellForm()}</div>`:`<div class="card hint">${roleNow()==="SHAREHOLDER"?"Bạn đang ở chế độ chỉ xem: không có nút bán, thu tiền hay sửa.":roleNow()==="DOCTOR"?"Vai trò Bác sĩ: chọn hợp đồng có phiếu chọn để chỉ định. Không hiển thị hoa hồng.":"Vai trò này không bán gói."}</div>`}
      ${sc.all||roleNow()==="RECEPTION"||roleNow()==="DOCTOR"?"":`<div class="card hint">Bạn chỉ thấy hợp đồng ${sc.label.toLowerCase()}.</div>`}
      <div class="card"><h3>Hợp đồng gói</h3>
        <div class="fld" style="margin-bottom:10px"><label for="q">Tìm theo mã, tên, 5 số cuối SĐT, mã đối tác</label><input id="q" value="${esc(ui.q)}" placeholder="Ví dụ: 482 hoặc GOI-000012"></div>

   <div class="card">
     <h3>${c.code} ${statusPill(c)}</h3>

       <div><div class="hint">Ký / thu đủ / hạn</div>${vnDate(c.signedAt)} · ${vnDate(c.fullyPaidAt)} · <b>${vnDate(c.expiresAt)}</b>${c.refundDueAt?`<div class="pill neg">Hạn hoàn ${vnDate(c.refundDueAt)}</div>`:""}</div>
     </div>
     <div class="sep" style="margin:12px 0"></div>
     <div class="grid g3">
       <div><div class="hint">Ví quyền lợi</div><div style="font-size:22px;font-weight:800">${vndH(bal)}</div><div class="prog"><i style="width:${bal/ENTITLEMENT*100}%"></i></div></div>
       <div><div class="hint">Đã thu (ròng)</div><div style="font-size:22px;font-weight:800">${vndH(paid)}</div>${due>0&&["SIGNED"].includes(c.status)?`<span class="pill pend">Còn phải thu ${vnd(due)}đ</span>`:""}</div>
       <div><div class="hint">Nếu chấm dứt hôm nay, hoàn (F1)</div><div style="font-size:22px;font-weight:800">${vndH(c.status==="ACTIVE"?F.refundUnused(bal):0)}</div></div>

     ${c.status==="ACTIVE"?`<div class="row" style="margin-top:12px"><button class="btn" data-end="${c.id}" data-reason="EXPIRED" ${S.can("end")?"":"disabled"}>Hết hạn: hoàn phần chưa dùng</button><button class="btn" data-end="${c.id}" data-reason="TERMINATED" ${S.can("end")?"":"disabled"}>Chấm dứt: hoàn phần chưa dùng</button>${S.used(c.id)===0?`<button class="btn warn" data-cancel="${c.id}" ${S.can("end")?"":"disabled"}>Huỷ hợp đồng, hoàn toàn bộ</button>`:""}</div>`:""}
   </div>

   ${c.status==="ACTIVE"&&!isDoc?`<div class="card"><h3>Dịch vụ ngoài gói (thu riêng, giá ưu đãi)</h3>${addonForm(c)}</div>`:""}
   <div class="card"><h3>Sao kê ví (từng bút toán)</h3>
     <div class="tbl"><table><thead><tr><th>Ngày</th><th>Nội dung</th><th class="r">Phát sinh</th><th class="r">Số dư</th></tr></thead><tbody>

  </div>`;
}
function selectionForm(c){
  const hasBundle=S.s.selections.some(s=>s.contractId===c.id&&s.lines.some(l=>l.code.startsWith("A")));

const SIM_DEF=[["packs","Gói bán / tháng",42,0,150,1,""],["cost","Giá vốn quyền lợi / gói",2000000,0,15000000,500000,"đ"],["refRate","Tỷ lệ gói có người giới thiệu",90,0,100,5,"%"],["staffPct","Chi nhân sự theo doanh số tổng",38,0,60,1,"%"],["fixed","Lương cố định / tháng",44000000,0,200000000,1000000,"đ"],["other","Mặt bằng, marketing, khác / tháng",60000000,0,500000000,5000000,"đ"],["addonRate","Tỷ lệ khách mua thêm ngoài gói",20,0,100,5,"%"],["addonAvg","Giá trị TB mua thêm",15000000,0,80000000,1000000,"đ"],["addonCogs","Giá vốn dịch vụ ngoài gói",40,0,90,5,"%"],["addonBps","Thù lao ngoài gói",12,10,15,1,"%"],["s2","Số suất 2% hiệu lực",7,0,10,1,""],["s5","Số suất 5% hiệu lực",3,0,5,1,""]];
function viewSim(){
  if(!ui.sim) ui.sim=Object.fromEntries(SIM_DEF.map(d=>[d[0],d[2]]));
  const v=ui.sim;
  const pkgRev=v.packs*PKG_PRICE, addonRev=Math.round(v.packs*v.addonRate/100*v.addonAvg), total=pkgRev+addonRev;
  const lines=[["Thu gói",pkgRev],["Thu dịch vụ ngoài gói",addonRev],["Hoa hồng giới thiệu 3tr",-Math.round(v.packs*v.refRate/100)*REFERRAL_FLAT],["Thù lao ngoài gói",-Math.round(addonRev*v.refRate/100*v.addonBps/100)],["Giá vốn quyền lợi",-v.packs*v.cost],["Giá vốn ngoài gói",-Math.round(addonRev*v.addonCogs/100)],[`Nhân sự ${v.staffPct}% doanh số tổng`,-Math.round(total*v.staffPct/100)],["Lương cố định",-v.fixed],["Chi phí khác",-v.other]];
  const profit=lines.reduce((a,l)=>a+l[1],0); const shareRate=v.s2*2+v.s5*5; const share=profit>0?Math.round(profit*shareRate/100):0;
  const per=PKG_PRICE-REFERRAL_FLAT-Math.round(PKG_PRICE*v.staffPct/100)-v.cost;
  const breakEven=per>0?Math.ceil((v.fixed+v.other)/per):null;
  const max=Math.max(...lines.map(l=>Math.abs(l[1])),Math.abs(profit),1);
  let run=0;
  return `<div class="head"><h2>Mô phỏng kinh tế đơn vị</h2><p>Kéo thanh trượt để xem chương trình lãi hay lỗ mỗi tháng trước khi bán thêm suất. Mặc định "doanh số tổng" = thực thu chương trình đối tác, không gồm tiền đóng suất (D5).</p></div>
  <div class="split"><div class="card stack">${SIM_DEF.map(([k,l,d,mn,mx,st,u])=>`<div class="fld"><label for="sim-${k}">${l}: <b class="num">${u==="đ"?vnd(v[k])+"đ":v[k]+(u||"")}</b></label><input id="sim-${k}" data-sim="${k}" type="range" min="${mn}" max="${mx}" step="${st}" value="${v[k]}"></div>`).join("")}<button class="btn" data-sim-reset="1">Về giả định mặc định</button></div>
  <div class="stack"><div class="grid g3">
    <div class="card kpi"><h3>Lợi nhuận tháng (ước)</h3><div class="v" style="color:${profit<0?"var(--neg)":"var(--pos)"}">${shortH(profit)}</div></div>
    <div class="card kpi"><h3>Phần của các suất (${shareRate}%)</h3><div class="v">${shortH(share)}</div><div class="s">Bệnh viện giữ ${short(profit-share)}</div></div>
    <div class="card kpi"><h3>Đóng góp mỗi gói</h3><div class="v">${shortH(per)}</div><div class="s">${breakEven?`Hoà vốn chi cố định ≈ ${breakEven} gói/tháng`:"Mỗi gói đang lỗ trước chi phí cố định"}</div></div></div>
   <div class="card"><h3>Thác nước tháng</h3><div class="bars wf">${lines.map(([l,a])=>{ const from=run; run+=a; const left=Math.min(from,run), w=Math.abs(a); const base=Math.min(0,...lines.map(()=>0)); return `<div class="bar"><span>${l}</span><div class="track"><i class="${a<0?"neg-i":"pos-i"}" style="left:${(left/(max*1.15))*50+50}%;width:${w/(max*1.15)*50}%"></i></div><b class="num" style="text-align:right;color:${a<0?"var(--neg)":"inherit"}">${short(a)}</b></div>`; }).join("")}<div class="bar"><b>Lợi nhuận</b><div class="track"><i class="tot-i" style="left:${(Math.min(0,profit)/(max*1.15))*50+50}%;width:${Math.abs(profit)/(max*1.15)*50}%"></i></div><b class="num" style="text-align:right">${short(profit)}</b></div></div>
   <p class="hint">Trục giữa là 0. Ví dụ ở mục 9 đặc tả: 1 gói, không mua thêm, giá vốn 2tr, 38% doanh số tổng → đóng góp 4.300.000đ/gói. Giá vốn thật của 30tr giá trị thẩm mỹ thường cao hơn 2tr; hãy kéo thử.</p></div></div></div>`;
}

// ---------- Phạm vi dữ liệu theo vai trò ----------
function scopeFor(){
  const a=S.actor();
  if(["ADMIN","MANAGER","SHAREHOLDER"].includes(a.role)) return {all:true,ids:STAFF.map(x=>x.id),label:"Toàn bộ trung tâm"};
  if(a.role==="LEAD") return {all:false,ids:STAFF.filter(x=>x.team===a.team).map(x=>x.id),label:"Của "+(TEAMS[a.team]||"nhóm")};
  return {all:false,ids:[a.id],label:"Của riêng bạn"};
}
function last6(){ const m=monthOf(S.today); return [5,4,3,2,1,0].map(k=>addMonths(m+"-01",-k).slice(0,7)); }
function staffMonth(id,m){
  const cs=S.s.contracts.filter(c=>c.soldById===id);
  const ids=new Set(cs.map(c=>c.id));
  const packs=cs.filter(c=>c.fullyPaidAt&&monthOf(c.fullyPaidAt)===m).length;
  const cash=S.s.pkgPayments.filter(p=>ids.has(p.contractId)&&monthOf(p.at)===m).reduce((a,p)=>a+p.amount,0)+S.s.addons.filter(x=>ids.has(x.contractId)&&monthOf(x.at)===m).reduce((a,x)=>a+x.paid,0);
  return {packs,cash};
}
// D5 mặc định: doanh số tổng = thực thu chương trình đối tác (gói + ngoài gói), không gồm tiền đóng suất.
function programRevenue(m){ return S.s.pkgPayments.filter(p=>monthOf(p.at)===m).reduce((a,p)=>a+p.amount,0)+S.s.addons.filter(x=>monthOf(x.at)===m).reduce((a,x)=>a+x.paid,0); }
function leaderIncome(st,m){ const rev=Math.max(0,programRevenue(m)); return (st.fixed||0)+mulDivFloor(rev,st.pctBps,10000); }
function growth(cur,prev){ if(!prev) return cur?`<span class="pill pos">mới</span>`:`<span class="pill mute">—</span>`; const g=Math.round((cur-prev)/Math.abs(prev)*100); return `<span class="pill ${g>=0?"pos":"neg"}">${g>=0?"▲":"▼"} ${Math.abs(g)}%</span>`; }

// Biểu đồ cột một chuỗi (một màu nhấn), cột cuối = tháng hiện tại (đang chạy) tô nhạt hơn.
function barChart(vals,labels,{fmt=short,h=130,unit=""}={}){
  const W=320,H=h,pl=4,pr=4,pt=18,pb=20, n=vals.length, max=Math.max(...vals,1), slot=(W-pl-pr)/n, bw=Math.min(28,slot*.58), base=H-pb;
  const bars=vals.map((v,i)=>{ const x=pl+i*slot+(slot-bw)/2, bh=Math.max(v>0?2:0,(Math.max(0,v)/max)*(base-pt)), y=base-bh, r=Math.min(4,bh/2,bw/2);
    const path=bh>0?`M${x},${base}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${base}Z`:"";
    const tip=`${labels[i]}: ${unit==="đ"?vnd(v)+"đ":v+unit}${i===n-1?" (tháng đang chạy)":""}`;
    return `<g data-tip="${esc(tip)}"><rect x="${pl+i*slot}" y="${pt}" width="${slot}" height="${base-pt}" fill="transparent"/>${path?`<path d="${path}" fill="var(--accent)" opacity="${i===n-1?.55:1}"/>`:""}<text x="${x+bw/2}" y="${H-5}" text-anchor="middle" font-size="10" fill="var(--mute)">${labels[i]}</text>${(i===n-1||v===max)&&v>0?`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">${fmt(v)}</text>`:""}</g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ cột theo tháng"><line x1="${pl}" x2="${W-pr}" y1="${base}" y2="${base}" stroke="var(--line)"/>${bars}</svg>`;
}
function spark(vals){ const W=84,H=24,n=vals.length,max=Math.max(...vals,1),slot=W/n,bw=slot*.6; return `<svg viewBox="0 0 ${W} ${H}" width="84" height="24" aria-hidden="true">${vals.map((v,i)=>{ const bh=Math.max(v>0?2:0,v/max*(H-2)); return `<rect x="${i*slot+(slot-bw)/2}" y="${H-bh}" width="${bw}" height="${bh}" rx="1.5" fill="var(--accent)" opacity="${i===n-1?.55:1}"/>`; }).join("")}</svg>`; }
const mlabel=m=>"T"+Number(m.slice(5));

  };
  const cls=v=>v==="—"||v==="Không thấy"?"mute":v.startsWith("Sửa")?"pos":"pend";
  return `<div class="head"><h2>Phân quyền</h2><p>Mỗi vai trò một phạm vi. Ranh giới được kiểm ở bộ máy nghiệp vụ, không chỉ ẩn nút: người không có quyền bấm vẫn bị từ chối và được ghi nhật ký. Hai việc nhạy cảm cần hai người: người lập lô chi trả không được tự duyệt.</p></div>
  <div class="tbl"><table><thead><tr><th>Vai trò</th>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>
  ${Object.entries(M).map(([r,v])=>`<tr><td><b>${ROLE_LABEL[r]}</b><div class="hint">${STAFF.filter(x=>x.role===r).map(x=>esc(x.name)).join(", ")}</div></td>${v.map(x=>`<td><span class="pill ${cls(x)}">${esc(x)}</span></td>`).join("")}</tr>`).join("")}
  </tbody></table></div>
  <div class="grid g2" style="margin-top:14px">
   <div class="card"><h3>Nguyên tắc</h3><div class="stack hint">
    <div>Cổ đông bệnh viện xem được toàn bộ số liệu kinh doanh nhưng không có nút sửa nào. Đây là vai trò riêng cho người góp vốn thật của bệnh viện; đối tác 2%/5% không bao giờ được gán vai trò này.</div>
    <div>Khách / đối tác chỉ thấy ví, thu nhập và hợp đồng của chính mình; người mình giới thiệu chỉ hiện tên viết tắt và 3 số cuối SĐT; không thấy hồ sơ y khoa.</div>
    <div>Bác sĩ chỉ định chuyên môn và không thấy bất kỳ con số hoa hồng nào.</div>
    <div>Trưởng nhóm xem hiệu suất của nhóm mình; tư vấn viên chỉ xem của mình.</div></div></div>
   <div class="card"><h3>Thử ngay</h3><div class="stack hint">
    <div>Chọn "Cổ đông bệnh viện" ở góc trên → mọi nút thao tác biến mất hoặc bị khoá.</div>
    <div>Chọn "Mai Anh — Tư vấn viên" → Hiệu suất chỉ còn số của Mai Anh; Quầy chỉ còn hợp đồng Mai Anh bán.</div>
    <div>Chọn "Thu Hà — Trưởng nhóm" → thấy cả nhóm Tư vấn 1.</div>
    <div>Chọn "Nguyễn Thị Hạnh — Khách mua gói" → chỉ còn cổng đối tác của chị Hạnh và danh mục.</div></div></div>
  </div>`;
}

// ---------- render & sự kiện ----------
function render(){
  renderTop();
  const r=route();
  if(location.hash.slice(1)!==r && location.hash){ history.replaceState(null,"","#"+r); }
  const v={"hieu-suat":viewPerformance,"phan-quyen":viewPerms,"dai-chi-huy":viewDashboard,"quay":viewCounter,"ke-toan":viewAccounting,"cong-doi-tac":viewPortal,"suat":viewSeats,"mo-phong":viewSim,"kiem-thu":viewTests,"danh-muc":viewCatalog,"nhat-ky":viewLog}[r];
  $("#app").innerHTML=`<div class="banner"><b>Bản chạy thử.</b> Dữ liệu là mẫu và chỉ lưu trong trình duyệt của bạn. Đổi "Đang thao tác" ở góc trên để xem mỗi vai trò thấy gì. <button class="btn sm" data-reset="1">Khôi phục dữ liệu mẫu</button></div>`+v();
  if(r==="cong-doi-tac"&&ui.ptab==="home"){ const el=$("#qr"); const p=S.partner(ui.portalPartner); if(el&&window.QRCode&&p){ try{ new QRCode(el,{text:"HONGPHUC-ALLIANCE:"+p.code,width:92,height:92,colorDark:"#052e25",colorLight:"#ffffff"}); }catch(e){} } else if(el&&p){ el.innerHTML=`<div class="mono" style="color:#052e25;width:92px;text-align:center">${p.code}</div>`; } }
}
const num=id=>Math.round(Number(String(($(id)||{}).value||"0").replace(/[^\d-]/g,""))||0);
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-contract],[data-collect],[data-cancel],[data-end],[data-rx],[data-redeem],[data-reconcile],[data-batch-create],[data-approve],[data-pay],[data-reject],[data-portal],[data-ptab],[data-activity],[data-run-tests],[data-reset],[data-sim-reset]");
  if(!t) return;
  const d=t.dataset;
  if(d.contract){ ui.contractId=d.contract; render(); return; }
  if(d.collect) return act(()=>S.collect(d.collect,num("#colAmt")),"Đã thu tiền.");
  if(d.cancel) return act(()=>S.cancel(d.cancel),"Đã huỷ hợp đồng và ghi bút toán hoàn tiền.");
  if(d.end) return act(()=>S.endWithRefund(d.end,d.reason),r=>`Đã kết thúc. Hoàn ${vnd(r)}đ (F1) trong 15 ngày làm việc.`);
  if(d.rx){ const i=+d.i; const sel=S.s.selections.find(x=>x.id===d.rx); const dec=sel.lines.map(()=>null); dec[i]={ok:d.ok==="1",qty:num(`#rx-${d.rx}-${i}`)}; return act(()=>S.prescribe(d.rx,dec),d.ok==="1"?"Đã chỉ định.":"Đã ghi không chỉ định."); }
  if(d.redeem){ const i=+d.i, k=`${d.redeem}-${i}`; return act(()=>S.redeem(d.redeem,i,{pin:($(`#pin-${k}`)||{}).value,overageConsent:!!($(`#oc-${k}`)||{}).checked,overagePaid:num(`#op-${k}`)}),"Đã ghi nhận sử dụng và trừ ví."); }
  if(d.reconcile) return act(()=>S.reconcile(d.reconcile),r=>`Đối soát xong: ${r.n} khoản, ${vnd(r.sum)}đ chuyển "Khả dụng".`);
  if(d.batchCreate) return act(()=>S.createBatch(),b=>`Đã lập ${b.code}: ${vnd(b.total)}đ — chờ Ban điều hành duyệt.`);
  if(d.approve) return act(()=>S.approveBatch(d.approve),"Đã duyệt lô, sinh giấy đề nghị thanh toán.");
  if(d.pay) return act(()=>S.payBatch(d.pay),"Đã ghi chuyển khoản. Các khoản chuyển 'Đã trả'.");
  if(d.reject) return act(()=>S.rejectBatch(d.reject),"Đã trả lại lô; các khoản quay về 'Khả dụng'.");
  if(d.portal){ ui.portalPartner=d.portal; ui.ptab="home"; location.hash="cong-doi-tac"; return; }
  if(d.ptab){ ui.ptab=d.ptab; render(); return; }
  if(d.activity) return act(()=>S.addActivity(d.activity,"Dự họp lớn / hỗ trợ chương trình (có biên bản)"),"Đã ghi nhận nhiệm vụ chung tháng này.");
  if(d.runTests){ runTests(); return; }
  if(d.simReset){ ui.sim=null; render(); return; }
  if(d.reset){ S.s=seedState(); save(); ui={contractId:null,q:"",portalPartner:null,ptab:"home",sim:null,testRun:null}; render(); toast("Đã khôi phục dữ liệu mẫu."); }
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  const f=ev.target;
  if(f.id==="sellForm") return act(()=>{ const c=S.sell({buyerName:$("#sName").value,last5:$("#sL5").value,referralCode:$("#sRef").value.trim(),pin:$("#sPin").value,firstPayment:Number($("#sPay").value)}); ui.contractId=c.id; ui.q=""; return c; },c=>`Đã ký ${c.code}. Mã đối tác của khách: ${S.partner(c.ownerPartnerId).code}.`);
  if(f.id==="selForm"){ const cid=f.dataset.cid; const b=(f.querySelector('input[name="bundle"]:checked')||{}).value||null; const options=b?[...f.querySelectorAll(`input[name="opt-${b}"]:checked`)].map(x=>x.value):[]; const code=$("#selB").value; const extras=code?[{code,qty:Number($("#selQ").value)||1}]:[]; return act(()=>S.saveSelection(cid,{bundle:b,options,extras}),"Đã lưu phiếu chọn. Chờ bác sĩ chỉ định."); }
  if(f.id==="addonForm"){ const cid=f.dataset.cid; const code=$("#adItem").value; return act(()=>S.addon(cid,{itemCode:code,name:itemByCode(code).name,gross:num("#adGross"),discount:num("#adDisc"),paid:num("#adPaid")}),"Đã ghi dịch vụ ngoài gói."); }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="q"){ ui.q=t.value; const pos=t.selectionStart; render(); const q=$("#q"); q.focus(); try{q.setSelectionRange(pos,pos);}catch(e){} }
  if(t.id==="sRef"){ const p=S.partnerByCode(t.value); $("#refInfo").innerHTML=t.value.trim()?(p?`<span class="ok">✓ ${esc(S.partnerName(p.id))} · ${p.code} — xác nhận đúng người với khách</span>`:`<span class="err">Không tìm thấy mã</span>`):"Nhập mã để hiện tên người giới thiệu và xác nhận đúng người."; }
  if(t.dataset.sim){ ui.sim[t.dataset.sim]=Number(t.value); const y=window.scrollY; render(); window.scrollTo(0,y); const el=$(`#sim-${t.dataset.sim}`); if(el) el.focus(); }
  if(t.id==="adItem"){ const p=Number(t.selectedOptions[0].dataset.price); $("#adGross").value=p; $("#adPaid").value=p-num("#adDisc"); }
  if(t.id==="adDisc"){ $("#adPaid").value=Math.max(0,num("#adGross")-num("#adDisc")); }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="actor"){ S.s.actorId=t.value; save(); if(!allowed(location.hash.slice(1))) history.replaceState(null,"","#"+defaultRoute()); render(); toast("Đang thao tác: "+S.actor().name+" — "+S.actor().label); }
  if(t.id==="today"&&t.value){ S.s.today=t.value; save(); render(); toast("Ngày hệ thống: "+vnDate(t.value)); }
  if(t.id==="pp"){ ui.portalPartner=t.value; ui.ptab="home"; render(); }
});
document.addEventListener("pointerover",ev=>{ const t=ev.target.closest&&ev.target.closest("[data-tip]"); const tip=$("#tip"); if(!t){ tip.hidden=true; return; } tip.textContent=t.dataset.tip; tip.hidden=false; const r=t.getBoundingClientRect(); tip.style.left=Math.min(window.innerWidth-270,Math.max(8,r.left))+"px"; tip.style.top=Math.max(8,r.top-38)+"px"; });
window.addEventListener("scroll",()=>{ $("#tip").hidden=true; },{passive:true});
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });
render();
</script>
